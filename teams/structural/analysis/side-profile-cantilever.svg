<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 610" width="620" height="610" font-family="sans-serif" font-size="12" fill="currentColor" stroke="currentColor">
  <title>Side profile: protrusion variance and loaded plant-shelf cantilever</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="13" stroke="none">Side profile: protrusion variance + loaded shelf (Shelf A, p = 30 cm). Scale 8 px = 1 cm.</text>

  <!-- wall datum -->
  <line x1="190" y1="40" x2="190" y2="540" stroke-width="3"/>
  <g stroke-width="1" opacity="0.5">
    <line x1="172" y1="58" x2="190" y2="40"/><line x1="172" y1="78" x2="190" y2="60"/><line x1="172" y1="98" x2="190" y2="80"/>
    <line x1="172" y1="118" x2="190" y2="100"/><line x1="172" y1="138" x2="190" y2="120"/><line x1="172" y1="158" x2="190" y2="140"/>
    <line x1="172" y1="178" x2="190" y2="160"/><line x1="172" y1="198" x2="190" y2="180"/><line x1="172" y1="218" x2="190" y2="200"/>
    <line x1="172" y1="238" x2="190" y2="220"/><line x1="172" y1="258" x2="190" y2="240"/>
    <line x1="172" y1="438" x2="190" y2="420"/><line x1="172" y1="458" x2="190" y2="440"/><line x1="172" y1="478" x2="190" y2="460"/>
    <line x1="172" y1="498" x2="190" y2="480"/><line x1="172" y1="518" x2="190" y2="500"/><line x1="172" y1="538" x2="190" y2="520"/>
  </g>
  <text x="20" y="56" stroke="none">wall datum</text>
  <text x="20" y="70" stroke="none">(x = 0)</text>

  <!-- body relief silhouette (max protrusion at each height) -->
  <path d="M190 40 L228 44 Q236 60 232 70 L286 78 L286 126 L236 142 L230 300 L232 400 Q238 440 230 480 L190 486 Z" fill-opacity="0.08" fill="currentColor" stroke-width="1.5"/>
  <text x="294" y="106" stroke="none">mask 12 cm</text>
  <text x="238" y="426" stroke="none">body relief ~5 cm</text>

  <!-- ghost shelves B and C -->
  <rect x="190" y="162" width="160" height="14" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="358" y="173" stroke="none">Shelf B, p = 20 cm</text>
  <rect x="190" y="440" width="80" height="12" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="278" y="450" stroke="none">Shelf C, p = 10 cm</text>

  <!-- loaded shelf A -->
  <path d="M190 300 L430 300 L430 326 Q300 338 220 380 L190 392 Z" fill="currentColor" fill-opacity="0.15" stroke-width="2.5"/>
  <text x="438" y="318" stroke="none">Shelf A tip</text>
  <!-- pot + plant -->
  <rect x="250" y="232" width="120" height="68" fill="none" stroke-width="2"/>
  <line x1="250" y1="244" x2="370" y2="244" stroke-width="1"/>
  <path d="M310 232 C 290 214 274 206 266 210 M310 232 C 310 210 312 198 318 192 M310 232 C 330 214 346 208 356 212" fill="none" stroke-width="2"/>
  <text x="256" y="268" stroke="none">pot + soil</text>
  <text x="256" y="283" stroke="none">5 kg</text>
  <circle cx="310" cy="262" r="3.5" stroke="none"/>

  <!-- W arrow at nominal centroid -->
  <line x1="310" y1="262" x2="310" y2="372" stroke-width="2" marker-end="url(#ah)"/>
  <text x="318" y="362" stroke="none">W = 73.6 N</text>
  <text x="318" y="377" stroke="none">(5 kg x 9.81 x 1.5)</text>
  <!-- W at tip, bounding -->
  <line x1="430" y1="262" x2="430" y2="352" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="438" y="272" stroke="none">W at tip</text>
  <text x="438" y="287" stroke="none">(bounding case)</text>

  <!-- anchors -->
  <circle cx="190" cy="296" r="6" fill="currentColor" stroke="none"/>
  <circle cx="190" cy="376" r="6" fill="currentColor" stroke="none"/>
  <line x1="184" y1="296" x2="70" y2="296" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="70" y="286" stroke="none">T upper (tension)</text>
  <line x1="70" y1="376" x2="184" y2="376" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="70" y="398" stroke="none">C lower (bearing)</text>

  <!-- s dimension -->
  <line x1="40" y1="296" x2="40" y2="376" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="46" y="340" stroke="none">s = 8-12 cm</text>
  <text x="46" y="354" stroke="none">(10 shown)</text>

  <!-- p and x_c dimensions -->
  <line x1="430" y1="330" x2="430" y2="500" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="190" y1="500" x2="430" y2="500" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="250" y="494" stroke="none">p = 30 cm (range 10-30)</text>
  <line x1="310" y1="392" x2="310" y2="525" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="190" y1="525" x2="310" y2="525" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="200" y="519" stroke="none">x_c = p/2 = 15 cm</text>

  <!-- arithmetic -->
  <text x="20" y="560" stroke="none">Nominal: M = W x x_c = 73.6 x 0.15 = 11.0 N.m;  T = C = M/s = 110 N (excl. self-wt)</text>
  <text x="20" y="577" stroke="none">Bound (W at tip, s = 8 cm, + 1 kg tentacle at p/2): M = 23.6 N.m;  T = 23.6/0.08 = 295 N</text>
  <text x="20" y="594" stroke="none">Nominal incl. 1 kg tentacle self-weight: 125 N. V = 83 N total, ~42 N per anchor (not drawn)</text>
</svg>
