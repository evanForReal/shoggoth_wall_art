<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Design Review</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--surface:#1a1a1a;--surface2:#252525;--border:#333;
  --text:#f0f0f0;--muted:#888;--accent:#a78bfa;
  --like:#22c55e;--dislike:#ef4444;--love:#f59e0b;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 8px) var(--safe-right) calc(var(--safe-bottom) + 8px) var(--safe-left)}

/* Loading / Error */
#loading,#error{flex:1;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--muted);text-align:center;padding:1rem}
#error{flex-direction:column;gap:.75rem}
#error button{padding:.6rem 1.2rem;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:.9rem;cursor:pointer}

/* Header */
#header{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;min-height:44px}
#round-title{font-size:.85rem;color:var(--muted);font-weight:500;letter-spacing:.03em;text-transform:uppercase;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#progress{font-size:.85rem;color:var(--muted);font-weight:600}
#undo-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer;min-width:44px;min-height:36px;transition:color .15s,border-color .15s}
#undo-btn:active{color:var(--text);border-color:var(--accent)}
#undo-btn:disabled{opacity:.3;cursor:default}

/* Card stack area */
#stack{flex:1;position:relative;overflow:hidden;margin:.25rem 0}

.card{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  border-radius:16px;overflow:hidden;
  background:var(--surface);
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  touch-action:none;user-select:none;
  will-change:transform;
  transition:box-shadow .2s;
}
.card.animating{transition:transform .3s cubic-bezier(.25,.46,.45,.94),opacity .3s}
.card-img-wrap{flex:1;position:relative;overflow:hidden;cursor:zoom-in;background:#111}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card-img-wrap.zoomed{cursor:zoom-out;position:fixed;inset:0;z-index:100;border-radius:0;background:#000}
.card-img-wrap.zoomed img{object-fit:contain;width:100%;height:100%}
.overlay{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .1s}
.overlay.like{background:linear-gradient(135deg,rgba(34,197,94,.5),transparent)}
.overlay.dislike{background:linear-gradient(225deg,rgba(239,68,68,.5),transparent)}
.overlay.love{background:linear-gradient(180deg,rgba(245,158,11,.5),transparent)}
.card-info{padding:.75rem 1rem .5rem;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 100%);position:absolute;bottom:0;left:0;right:0}
.card-title{font-size:1.05rem;font-weight:700;line-height:1.25;margin-bottom:.3rem}
.card-axis{display:inline-block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:.2rem .55rem;border-radius:20px;background:rgba(167,139,250,.25);color:var(--accent);border:1px solid rgba(167,139,250,.4);margin-bottom:.35rem}
.card-rationale{font-size:.8rem;color:rgba(240,240,240,.8);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Verdict hint stamps */
.stamp{position:absolute;top:1.5rem;font-size:1.5rem;font-weight:900;letter-spacing:.08em;padding:.3rem .6rem;border-radius:8px;border:3px solid;opacity:0;pointer-events:none;transform:rotate(-15deg)}
.stamp.like-stamp{left:1.2rem;color:var(--like);border-color:var(--like);transform:rotate(-15deg)}
.stamp.dislike-stamp{right:1.2rem;color:var(--dislike);border-color:var(--dislike);transform:rotate(15deg)}
.stamp.love-stamp{left:50%;transform:translateX(-50%) rotate(-5deg);color:var(--love);border-color:var(--love)}

/* Notes */
.notes-wrap{padding:.4rem 1rem .6rem;background:var(--surface)}
.notes-toggle{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer;padding:.2rem 0;display:flex;align-items:center;gap:.35rem;width:100%}
.notes-toggle::before{content:'▶';font-size:.6rem;transition:transform .2s}
.notes-toggle.open::before{transform:rotate(90deg)}
.notes-area{display:none;margin-top:.4rem}
.notes-area.open{display:block}
.notes-area textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .65rem;font-size:.82rem;line-height:1.45;resize:none;min-height:64px;font-family:inherit}
.notes-area textarea:focus{outline:none;border-color:var(--accent)}

/* Action bar */
#actions{display:flex;align-items:center;justify-content:space-around;padding:.5rem .5rem calc(.5rem);gap:.5rem}
.action-btn{display:flex;flex-direction:column;align-items:center;gap:.2rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;min-width:72px;min-height:60px;cursor:pointer;color:var(--text);font-size:.7rem;font-weight:600;padding:.5rem .4rem;transition:background .15s,transform .1s,border-color .15s}
.action-btn:active{transform:scale(.92)}
.action-btn .icon{font-size:1.5rem;line-height:1}
.action-btn.like-btn{border-color:rgba(34,197,94,.4);color:var(--like)}
.action-btn.like-btn:active{background:rgba(34,197,94,.12)}
.action-btn.dislike-btn{border-color:rgba(239,68,68,.4);color:var(--dislike)}
.action-btn.dislike-btn:active{background:rgba(239,68,68,.12)}
.action-btn.love-btn{border-color:rgba(245,158,11,.4);color:var(--love)}
.action-btn.love-btn:active{background:rgba(245,158,11,.12)}

/* Summary screen */
#summary{flex:1;display:flex;flex-direction:column;overflow:hidden}
#summary h2{font-size:1.1rem;font-weight:700;padding:.75rem 1rem .5rem;flex-shrink:0}
#verdict-table{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 .75rem}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:start;padding:.6rem 0;border-bottom:1px solid var(--border)}
.vrow:last-child{border-bottom:none}
.vid{font-size:.75rem;color:var(--muted);font-weight:600;padding-top:.15rem}
.vbadge{font-size:.7rem;font-weight:700;text-transform:uppercase;padding:.2rem .45rem;border-radius:6px;white-space:nowrap;cursor:pointer}
.vbadge.like{background:rgba(34,197,94,.2);color:var(--like);border:1px solid rgba(34,197,94,.4)}
.vbadge.dislike{background:rgba(239,68,68,.2);color:var(--dislike);border:1px solid rgba(239,68,68,.4)}
.vbadge.love{background:rgba(245,158,11,.2);color:var(--love);border:1px solid rgba(245,158,11,.4)}
.vtitle{font-size:.82rem;font-weight:500}
.vnotes{font-size:.75rem;color:var(--muted);margin-top:.2rem;font-style:italic}
.vedit{font-size:.72rem;color:var(--accent);cursor:pointer;padding:.15rem 0;white-space:nowrap}
#sum-actions{display:flex;flex-direction:column;gap:.6rem;padding:.75rem 1rem;flex-shrink:0}
#sum-actions button{width:100%;padding:.85rem;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;border:none;min-height:52px}
#submit-btn{background:var(--accent);color:#0d0d0d}
#copy-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
#copy-fallback{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:.75rem;padding:.5rem;border-radius:8px;resize:vertical;min-height:80px;font-family:monospace;display:none;width:100%}
#sum-note{font-size:.72rem;color:var(--muted);text-align:center;padding:.25rem 0 .5rem}

/* Hidden */
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="loading">Loading…</div>
  <div id="error" class="hidden">
    <span id="error-msg">Failed to load manifest.</span>
    <button onclick="location.reload()">Retry</button>
  </div>

  <!-- Review UI (hidden until loaded) -->
  <div id="review-ui" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div id="header">
      <span id="round-title"></span>
      <span id="progress"></span>
      <button id="undo-btn" disabled>↩ Undo</button>
    </div>
    <div id="stack"></div>
    <div id="actions">
      <button class="action-btn dislike-btn" id="btn-dislike"><span class="icon">✕</span>Nope</button>
      <button class="action-btn love-btn" id="btn-love"><span class="icon">★</span>Love it</button>
      <button class="action-btn like-btn" id="btn-like"><span class="icon">♥</span>Like</button>
    </div>
  </div>

  <!-- Summary screen -->
  <div id="summary" class="hidden">
    <h2>Your Review</h2>
    <div id="verdict-table"></div>
    <div id="sum-actions">
      <button id="submit-btn">Submit via GitHub ↗</button>
      <button id="copy-btn">Copy JSON</button>
      <textarea id="copy-fallback" readonly></textarea>
      <div id="sum-note">GitHub issues have an ~8 KB URL limit. If the link fails, use Copy JSON and paste manually.</div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// ── Utility ──────────────────────────────────────────────────────────────────
function qs(sel,root){return(root||document).querySelector(sel)}
function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi)}
function isoDate(){return new Date().toISOString().slice(0,10)}

// ── State ─────────────────────────────────────────────────────────────────────
var manifest=null;
var cards=[];
var index=0;
var verdicts={};  // id -> {verdict,notes}
var history=[];   // stack of {index, snapshot of verdicts}
var round='round-01';
var storageKey='';

function saveLocal(){
  try{localStorage.setItem(storageKey,JSON.stringify({index,verdicts}))}catch(e){}
}
function loadLocal(){
  try{
    var d=JSON.parse(localStorage.getItem(storageKey)||'null');
    if(d&&typeof d.index==='number'){index=d.index;verdicts=d.verdicts||{}}
  }catch(e){}
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init(){
  var params=new URLSearchParams(location.search);
  round=params.get('round')||'round-01';
  storageKey='shoggoth-review-'+round;

  var base=location.pathname.replace(/\/[^/]*$/,'/');
  var manifestUrl='../review/rounds/'+round+'/manifest.json';

  fetch(manifestUrl)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(m){
      manifest=m;
      cards=m.cards||[];
      if(!cards.length){showError('Manifest has no cards.');return}
      loadLocal();
      if(index>=cards.length){showSummary();return}
      qs('#loading').classList.add('hidden');
      var ui=qs('#review-ui');
      ui.classList.remove('hidden');
      ui.style.display='flex';
      qs('#round-title').textContent=m.title||round;
      renderCard();
      updateHeader();
    })
    .catch(function(e){showError('Could not load manifest: '+e.message)});
}

function showError(msg){
  qs('#loading').classList.add('hidden');
  qs('#error-msg').textContent=msg;
  qs('#error').classList.remove('hidden');
}

// ── Image base URL resolution ─────────────────────────────────────────────────
function imgUrl(path){
  // absolute URLs (hotlinked art) pass through; otherwise relative to the round's manifest directory
  if(/^https?:\/\//i.test(path))return path;
  return '../review/rounds/'+round+'/'+path;
}

// ── Render card ───────────────────────────────────────────────────────────────
var dragState=null;

function renderCard(){
  var stack=qs('#stack');
  stack.innerHTML='';

  if(index>=cards.length){
    var ui=qs('#review-ui');
    ui.classList.add('hidden');
    ui.style.display='none';
    showSummary();
    return;
  }

  var c=cards[index];
  var el=buildCardEl(c);
  stack.appendChild(el);
  attachDrag(el);
  updateHeader();
}

function buildCardEl(c){
  var el=document.createElement('div');
  el.className='card';
  el.innerHTML=
    '<div class="card-img-wrap" id="img-wrap">'+
      '<img src="'+imgUrl(c.image)+'" alt="'+escHtml(c.title)+'" draggable="false" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'beforeend\',\'<div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-size:.9rem;padding:1rem;text-align:center&quot;>image unavailable — see source link in notes</div>\')">'+
      '<div class="overlay like" id="ov-like"></div>'+
      '<div class="overlay dislike" id="ov-dislike"></div>'+
      '<div class="overlay love" id="ov-love"></div>'+
      '<div class="stamp like-stamp">LIKE</div>'+
      '<div class="stamp dislike-stamp">NOPE</div>'+
      '<div class="stamp love-stamp">LOVE</div>'+
      '<div class="card-info">'+
        '<div class="card-axis">'+escHtml(c.axis||'')+'</div>'+
        '<div class="card-title">'+escHtml(c.title||'')+'</div>'+
        (c.rationale?'<div class="card-rationale">'+escHtml(c.rationale)+'</div>':'')+
      '</div>'+
    '</div>'+
    '<div class="notes-wrap">'+
      '<button class="notes-toggle" id="notes-toggle">Notes (optional)</button>'+
      '<div class="notes-area" id="notes-area">'+
        '<textarea placeholder="What would you prefer about this?" rows="3" id="notes-input">'+
          escHtml((verdicts[c.id]||{}).notes||'')+
        '</textarea>'+
      '</div>'+
    '</div>';

  // zoom toggle
  var imgWrap=el.querySelector('#img-wrap');
  imgWrap.addEventListener('click',function(e){
    if(dragState&&dragState.moved)return;
    imgWrap.classList.toggle('zoomed');
  });

  // notes toggle
  var toggle=el.querySelector('#notes-toggle');
  var area=el.querySelector('#notes-area');
  toggle.addEventListener('click',function(){
    var open=area.classList.toggle('open');
    toggle.classList.toggle('open',open);
  });

  // save notes on blur
  var notesInput=el.querySelector('#notes-input');
  notesInput.addEventListener('input',function(){saveNotes(c.id,notesInput.value)});

  return el;
}

function saveNotes(id,val){
  if(!verdicts[id])verdicts[id]={verdict:null,notes:''};
  verdicts[id].notes=val;
  saveLocal();
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Drag / Swipe ──────────────────────────────────────────────────────────────
function attachDrag(el){
  var startX=0,startY=0,curX=0,curY=0;
  dragState={moved:false};

  function onStart(e){
    var pt=e.touches?e.touches[0]:e;
    startX=pt.clientX;startY=pt.clientY;curX=0;curY=0;
    dragState={moved:false,startX,startY};
    el.style.transition='none';
  }
  function onMove(e){
    if(!dragState)return;
    var pt=e.touches?e.touches[0]:e;
    curX=pt.clientX-startX;
    curY=pt.clientY-startY;
    if(Math.abs(curX)>6)dragState.moved=true;
    var rot=curX*0.08;
    el.style.transform='translateX('+curX+'px) translateY('+curY*.3+'px) rotate('+rot+'deg)';
    var ratio=clamp(Math.abs(curX)/120,0,1);
    updateOverlay(el,curX,ratio);
    e.preventDefault();
  }
  function onEnd(){
    if(!dragState)return;
    var dx=curX;
    dragState.moved=false;
    el.style.transition='';
    if(dx>90){flyOut(el,'like')}
    else if(dx<-90){flyOut(el,'dislike')}
    else{
      el.classList.add('animating');
      el.style.transform='';
      clearOverlay(el);
      setTimeout(function(){el.classList.remove('animating')},300);
    }
    dragState=null;
  }

  el.addEventListener('pointerdown',onStart,{passive:true});
  el.addEventListener('pointermove',onMove,{passive:false});
  el.addEventListener('pointerup',onEnd,{passive:true});
  el.addEventListener('pointercancel',function(){
    if(!dragState)return;
    el.style.transform='';
    clearOverlay(el);
    dragState=null;
  },{passive:true});
}

function updateOverlay(el,dx,ratio){
  var ovLike=el.querySelector('#ov-like');
  var ovDislike=el.querySelector('#ov-dislike');
  var likeStamp=el.querySelector('.like-stamp');
  var dislikeStamp=el.querySelector('.dislike-stamp');
  if(dx>0){
    ovLike.style.opacity=ratio;ovDislike.style.opacity=0;
    likeStamp.style.opacity=ratio;dislikeStamp.style.opacity=0;
  }else{
    ovDislike.style.opacity=ratio;ovLike.style.opacity=0;
    dislikeStamp.style.opacity=ratio;likeStamp.style.opacity=0;
  }
}
function clearOverlay(el){
  ['#ov-like','#ov-dislike','#ov-love'].forEach(function(s){el.querySelector(s).style.opacity=0});
  ['.like-stamp','.dislike-stamp','.love-stamp'].forEach(function(s){el.querySelector(s).style.opacity=0});
}

// ── Verdict actions ───────────────────────────────────────────────────────────
function flyOut(el,verdict){
  var card=qs('#stack .card');
  var notesInput=card?card.querySelector('#notes-input'):null;
  var notes=notesInput?notesInput.value:'';

  history.push({index,verdicts:JSON.parse(JSON.stringify(verdicts))});
  if(!verdicts[cards[index].id])verdicts[cards[index].id]={verdict:null,notes:''};
  verdicts[cards[index].id].verdict=verdict;
  verdicts[cards[index].id].notes=notes;
  index++;
  saveLocal();

  // animate el out
  el.classList.add('animating');
  var tx=verdict==='dislike'?-window.innerWidth*1.5:window.innerWidth*1.5;
  var rot=verdict==='dislike'?-25:25;
  el.style.transform='translateX('+tx+'px) rotate('+rot+'deg)';
  el.style.opacity='0';
  if(verdict==='love'){
    el.style.transform='translateY(-'+window.innerHeight+'px) scale(1.1)';
    el.style.opacity='0';
  }

  updateUndoBtn();
  setTimeout(function(){renderCard()},320);
}

function doVerdict(verdict){
  if(index>=cards.length)return;
  var stack=qs('#stack');
  var el=stack.querySelector('.card');
  if(!el)return;

  // show overlay briefly then fly
  var ovLike=el.querySelector('#ov-like');
  var ovDislike=el.querySelector('#ov-dislike');
  var ovLove=el.querySelector('#ov-love');
  var likeStamp=el.querySelector('.like-stamp');
  var dislikeStamp=el.querySelector('.dislike-stamp');
  var loveStamp=el.querySelector('.love-stamp');

  if(verdict==='like'){ovLike.style.opacity=1;likeStamp.style.opacity=1}
  else if(verdict==='dislike'){ovDislike.style.opacity=1;dislikeStamp.style.opacity=1}
  else if(verdict==='love'){ovLove.style.opacity=1;loveStamp.style.opacity=1}

  setTimeout(function(){flyOut(el,verdict)},120);
}

function doUndo(){
  if(!history.length)return;
  var prev=history.pop();
  index=prev.index;
  verdicts=prev.verdicts;
  saveLocal();
  updateUndoBtn();
  renderCard();
}

function updateUndoBtn(){
  qs('#undo-btn').disabled=!history.length;
}
function updateHeader(){
  qs('#progress').textContent=(index+1)+' / '+cards.length;
  updateUndoBtn();
}

// ── Button wiring ─────────────────────────────────────────────────────────────
qs('#btn-like').addEventListener('click',function(){doVerdict('like')});
qs('#btn-dislike').addEventListener('click',function(){doVerdict('dislike')});
qs('#btn-love').addEventListener('click',function(){doVerdict('love')});
qs('#undo-btn').addEventListener('click',doUndo);

// ── Summary ───────────────────────────────────────────────────────────────────
var VERDICT_CYCLE=['like','dislike','love'];

function showSummary(){
  qs('#review-ui').classList.add('hidden');
  var sum=qs('#summary');
  sum.classList.remove('hidden');
  renderSummaryTable();

  qs('#submit-btn').onclick=function(){submitReview()};
  qs('#copy-btn').onclick=function(){copyJson()};
}

function renderSummaryTable(){
  var tbl=qs('#verdict-table');
  tbl.innerHTML='';
  cards.forEach(function(c){
    var v=verdicts[c.id]||{verdict:'dislike',notes:''};
    var verd=v.verdict||'dislike';
    var row=document.createElement('div');
    row.className='vrow';
    row.innerHTML=
      '<div class="vid">#'+escHtml(c.id)+'</div>'+
      '<div>'+
        '<div class="vtitle">'+escHtml(c.title)+'</div>'+
        (v.notes?'<div class="vnotes">'+escHtml(v.notes)+'</div>':'')+
      '</div>'+
      '<div>'+
        '<span class="vbadge '+verd+'" data-id="'+escHtml(c.id)+'">'+verd+'</span>'+
      '</div>';
    // cycle verdict on badge tap
    row.querySelector('.vbadge').addEventListener('click',function(e){
      var id=e.target.dataset.id;
      var cur=verdicts[id]?verdicts[id].verdict||'dislike':'dislike';
      var next=VERDICT_CYCLE[(VERDICT_CYCLE.indexOf(cur)+1)%VERDICT_CYCLE.length];
      if(!verdicts[id])verdicts[id]={verdict:next,notes:''};
      else verdicts[id].verdict=next;
      saveLocal();
      renderSummaryTable();
    });
    tbl.appendChild(row);
  });
}

function buildPayload(){
  var verdictsArr=cards.map(function(c){
    var v=verdicts[c.id]||{verdict:'dislike',notes:''};
    var obj={id:c.id,verdict:v.verdict||'dislike'};
    if(v.notes&&v.notes.trim())obj.notes=v.notes.trim();
    return obj;
  });
  return {round:manifest.round,reviewed:isoDate(),verdicts:verdictsArr};
}

function submitReview(){
  var payload=buildPayload();
  var json=JSON.stringify(payload,null,2);
  var body='## Review submission\n\n```json\n'+json+'\n```\n';
  var repo=manifest.issue_repo||'evanForReal/shoggoth_wall_art';
  var title='Review '+manifest.round;
  var url='https://github.com/'+repo+'/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
  if(url.length>8000){
    alert('URL too long ('+url.length+' chars). Use "Copy JSON" and paste into a new issue manually.');
    return;
  }
  window.open(url,'_blank','noopener,noreferrer');
}

function copyJson(){
  var json=JSON.stringify(buildPayload(),null,2);
  var fallback=qs('#copy-fallback');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){
      var btn=qs('#copy-btn');
      var orig=btn.textContent;
      btn.textContent='Copied!';
      fallback.style.display='none';
      setTimeout(function(){btn.textContent=orig},2000);
    }).catch(function(){showFallback(json)});
  }else{
    showFallback(json);
  }
}

function showFallback(json){
  var fallback=qs('#copy-fallback');
  fallback.style.display='block';
  fallback.value=json;
  fallback.select();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
init();

})();
</script>
</body>
</html>
